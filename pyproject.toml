[project]
name = "minos-bench"
version = "0.1.0"
description = "本地优先、可追溯的大模型质量评测工作台"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepeval>=4.1.4,<5",
    "jsonschema>=4.25,<5",
    "litellm>=1.77,<2",
    "pandas>=2.3,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "streamlit>=1.60,<2",
]

[project.scripts]
minos-bench = "llm_eval_workbench.cli:main"
llm-eval = "llm_eval_workbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_workbench"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["llm_eval_workbench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"scripts/build_scientific_v1.py" = ["E501"]
