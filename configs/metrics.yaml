version: "1.0"
adjudication:
  statuses:
    - PASS
    - REVIEW
    - FAIL
    - RUNTIME_ERROR
  judge_can_hard_fail: false
  deterministic_hard_failure_status: FAIL
  semantic_below_threshold_status: REVIEW
  judge_runtime_error_status: RUNTIME_ERROR
judge:
  primary_metric: task_specific_g_eval
  threshold: 0.75
  review_floor: 0.45
  instability_delta: 0.20
  default_repetitions: 1
  calibration_repetitions: 3
task_packs:
  instruction_generation:
    deterministic:
      - constraint_checks
      - output_shape
    semantic:
      - task_specific_g_eval
  grounded_qa:
    deterministic:
      - required_and_forbidden_facts
    semantic:
      - task_specific_g_eval
      - optional_faithfulness
      - optional_answer_relevancy
  multi_turn:
    deterministic:
      - explicit_constraint_checks
    semantic:
      - task_specific_g_eval
      - optional_knowledge_retention
  structured_tool:
    deterministic:
      - json_schema
      - field_values
      - tool_name_arguments_and_order
    semantic:
      - task_specific_g_eval
notes:
  - Optional specialized DeepEval metrics run only when their input contract is satisfied.
  - The fixed baseline semantic metric is task-specific G-Eval.
  - Deterministic-only results always retain evaluation_scope and incomplete semantic coverage.
